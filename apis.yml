aid: charm-industrial
name: Charm Industrial
description: >-
  Charm Industrial is a carbon removal technology company that permanently
  sequesters atmospheric CO2 by converting waste biomass (agricultural residues
  and other plant matter) into a stable, carbon-rich liquid called bio-oil
  through fast pyrolysis, then injecting that bio-oil into EPA-regulated
  underground wells where it solidifies and remains stored for millennia. Charm
  sells verified carbon dioxide removal (CDR) credits to enterprise buyers and
  publishes a public ledger of delivered tonnage. The company received a $53M
  advance market commitment from Frontier and is backed by investors including
  General Catalyst and Lowercarbon Capital. This API Evangelist profile tracks
  Charm Industrial as a company; the provider publishes a marketing and
  carbon-purchasing website but no public developer API surface as of this
  enrichment pass.
